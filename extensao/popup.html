<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Controle de Ponto</title>
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ponto" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="web.css" />
  <script src="api.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>Ponto</h1>
      <span id="today-date" class="topbar-date"></span>
    </div>
    <div class="topbar-actions">
      <button id="refresh-button" class="icon-button" type="button" title="Atualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="settings-button" class="icon-button" type="button" title="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <section id="settings" class="card" hidden>
      <h2>Configurações</h2>
      <label id="theme-label">Aparência</label>
      <div id="theme-options" class="segmented" role="group" aria-labelledby="theme-label">
        <button type="button" data-tema="auto">Automático</button>
        <button type="button" data-tema="claro">Claro</button>
        <button type="button" data-tema="escuro">Escuro</button>
      </div>
      <label for="url-input">URL do Web App (Apps Script)</label>
      <input id="url-input" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" />
      <button id="copy-link" class="link-button" type="button" hidden>Copiar link para configurar o celular</button>
      <div class="form-actions">
        <button id="settings-cancel" class="secondary-button" type="button">Cancelar</button>
        <button id="settings-save" class="primary-button" type="button">Salvar</button>
      </div>
    </section>

    <section class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"/>
        </svg>
        <div class="ring-center">
          <strong id="worked" class="worked">--:--</strong>
          <span id="worked-of" class="worked-of"></span>
        </div>
      </div>
      <div class="hero-side">
        <span id="hero-day" class="eyebrow">Hoje</span>
        <span id="hero-chip" class="chip">Carregando...</span>
        <div id="balance" class="balance">
          <span class="balance-label">Saldo acumulado</span>
          <strong id="saldo-value" class="balance-value">--:--</strong>
          <span id="saldo-hint" class="balance-hint"></span>
        </div>
      </div>
    </section>

    <section class="card day-card">
      <div class="card-heading">
        <h2 id="day-title">Hoje</h2>
        <button id="back-today" class="link-button inline" type="button" hidden>Voltar para hoje</button>
        <span id="clock" class="pill">--:--</span>
      </div>
      <ol id="timeline" class="timeline"></ol>
      <button id="primary-action" class="cta" type="button" hidden></button>
      <p id="day-footer" class="day-footer" hidden></p>
    </section>

    <section class="card manual-card">
      <button id="manual-toggle" class="disclosure" type="button" aria-expanded="false" aria-controls="manual-panel">
        <span>Lançamento manual</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="manual-panel" class="manual-panel" hidden>
        <div class="manual-grid">
          <div>
            <label for="manual-date">Dia</label>
            <input id="manual-date" type="date" />
          </div>
          <div>
            <label for="manual-time">Horário</label>
            <input id="manual-time" type="time" />
          </div>
          <div>
            <label for="manual-tipo">Tipo</label>
            <select id="manual-tipo"></select>
          </div>
        </div>
        <button id="manual-submit" class="primary-button full" type="button">Lançar</button>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
